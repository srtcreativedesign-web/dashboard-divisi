name: CI — quality gate + migration dry-run

on:
  push:
    branches: [main, development]
  pull_request:
    branches: [main, development]

jobs:
  quality-gate:
    runs-on: ubuntu-latest
    env:
      JWT_SECRET: test-jwt-secret-min-32-karakter-untuk-ci-1234567890
      APP_KEY: base64:dGVzdC1hcHBrZXktbWluLTMyLWthcmFrdGVyLWNpMTIzNDU2Nzg5MDE=
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none
          tools: composer

      - name: Install JS deps (npm workspaces)
        run: npm ci

      - name: Install PHP deps
        working-directory: apps/api
        run: composer install --no-interaction --prefer-dist

      - name: Prepare Laravel env (.env + key)
        working-directory: apps/api
        run: |
          cp .env.example .env || echo "APP_KEY=${APP_KEY}" > .env
          php artisan key:generate --force || true

      - name: Check env (opsional, non-blocking)
        run: npm run check:env || echo "check:env skip"

      - name: Lint (eslint)
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Build (vite + contracts + db)
        run: npm run build

      - name: Test FE + contracts (vitest, 29+2)
        run: npm run test

      - name: Pint — code style (Laravel)
        working-directory: apps/api
        run: ./vendor/bin/pint --test

      - name: Test BE (php artisan test, sqlite :memory:, 74 tests)
        working-directory: apps/api
        run: php artisan test --without-tty

      - name: Migration dry-run (pretend, tanpa DB eksternal)
        working-directory: apps/api
        run: php artisan migrate --pretend --force

  migration-dry-run-with-db:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: user
          POSTGRES_PASSWORD: password
          POSTGRES_DB: dashboard_divisi_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      APP_KEY: base64:dGVzdC1hcHBrZXktbWluLTMyLWthcmFrdGVyLWNpMTIzNDU2Nzg5MDE=
      JWT_SECRET: test-jwt-secret-min-32-karakter-untuk-ci-1234567890
      DB_CONNECTION: pgsql
      DB_HOST: 127.0.0.1
      DB_PORT: 5432
      DB_DATABASE: dashboard_divisi_test
      DB_USERNAME: user
      DB_PASSWORD: password
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none
          tools: composer
      - name: Install PHP deps
        working-directory: apps/api
        run: composer install --no-interaction --prefer-dist
      - name: Prepare env
        working-directory: apps/api
        run: |
          cp .env.example .env || true
          php artisan key:generate --force || true
      - name: Migrate deploy (real pgsql) + seed idempotency
        working-directory: apps/api
        run: |
          php artisan migrate --force
          php artisan db:seed --force
          php artisan db:seed --force
          echo "migrate + seed idempotent verified (pgsql)"
